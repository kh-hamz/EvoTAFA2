[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgeiiot-fl-research"
version = "0.1.0"
description = "Leakage-resistant dataset verification, client construction, and preprocessing for Edge-IIoTset FL"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.23.0"]

[project.optional-dependencies]
training = ["torch==2.10.0", "numpy==2.5.3", "psutil==7.2.2"]

[project.scripts]
edgefl = "edgefl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
edgefl = ["schemas/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
